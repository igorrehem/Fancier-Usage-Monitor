[package]
name = "fancier-usage-monitor"
version = "1.5.0"
edition = "2021"
license = "MIT"
description = "Fancier Usage Monitor"
homepage = "https://github.com/igorrehem/Fancier-Usage-Monitor"
repository = "https://github.com/igorrehem/Fancier-Usage-Monitor"

[package.metadata.winres]
CompanyName = "igorrehem"
ProductName = "Fancier Usage Monitor"
FileDescription = "Fancier Usage Monitor"
OriginalFilename = "fancier-usage-monitor.exe"
InternalName = "FancierUsageMonitor"
Comments = "https://github.com/igorrehem/Fancier-Usage-Monitor"
LegalCopyright = "Copyright (C) 2026 igorrehem"

[dependencies]
ccum-core = { path = "../ccum-core" }
ureq = { version = "2", default-features = false, features = ["native-tls", "json", "proxy-from-env"] }
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
dirs = "6"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
]

[build-dependencies]
winres = "0.1"
