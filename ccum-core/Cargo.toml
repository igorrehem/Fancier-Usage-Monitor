[package]
name = "ccum-core"
version = "1.5.0"
edition = "2021"
license = "MIT"
description = "Platform-agnostic core (settings, presets, animation, poller, localization) for Claude Code Usage Monitor"
publish = false

[dependencies]
ureq = { version = "2", default-features = false, features = ["native-tls", "json", "proxy-from-env"] }
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
