[workspace]
resolver = "2"
members = ["ccum-core", "ccum-windows", "ccum-unix"]
default-members = ["ccum-windows"]

# Shared release profile for every workspace member. `[profile.*]` sections are only honored in
# the workspace root manifest (this file is now a virtual `[workspace]` manifest with no
# `[package]` of its own), so this moved here verbatim from the pre-workspace root Cargo.toml.
[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
